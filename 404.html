<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YuuStore</title>
  <script>
    // Redirect all 404 paths to index.html for React Router
    var pathSegmentsToKeep = 1; // /yuustore-marketplace
    var l = window.location;
    var redirect = l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + (l.hash ? '#' + l.hash : '');
    l.replace(redirect);
  </script>
</head>
<body></body>
</html>
