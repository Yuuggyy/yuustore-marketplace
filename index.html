<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YuuStore — Le centre commercial dans votre poche</title>
  <meta name="description" content="YuuStore, le meilleur centre commercial en ligne en RDC. Achetez, vendez et commandez des produits et services." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/yuustore-marketplace/favicon.png" />
  <link rel="apple-touch-icon" href="/yuustore-marketplace/logo.png" />
  <script>
    // GitHub Pages SPA redirect: convert ?/path back to /path
    (function() {
      var l = window.location;
      if (l.search && l.search.indexOf('?/') === 0) {
        var redirect = l.protocol + '//' + l.host + l.pathname + l.search.replace(/^\?/, '').replace(/~and~/g, '&') + l.hash;
        history.replaceState(null, null, redirect);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
